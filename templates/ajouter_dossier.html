{% extends "base.html" %}

{% block content %}

<h2>Ajouter un dossier de réparation</h2>

<form method="POST">

<div class="mb-3">
<label>État</label>

<select class="form-control" name="etat">

<option>En attente</option>
<option>En cours</option>
<option>Terminé</option>

</select>

</div>


<div class="mb-3">

<label>Coût estimé</label>

<input
type="number"
step="0.01"
class="form-control"
name="cout_estime">

</div>


<div class="mb-3">

<label>Notes techniques</label>

<textarea
class="form-control"
name="notes">

</textarea>

</div>


<div class="mb-3">

<label>Véhicule</label>

<select
class="form-control"
name="vehicule_id">

{% for vehicule in vehicules %}

<option value="{{vehicule.id}}">

{{vehicule.marque}}
{{vehicule.modele}}
-
{{vehicule.client.nom}}

</option>

{% endfor %}

</select>

</div>


<div class="form-check">

<input
type="checkbox"
class="form-check-input"
name="validation_client">

<label class="form-check-label">

Validation client

</label>

</div>

<br>

<button class="btn btn-success">

Enregistrer

</button>

</form>

{% endblock %}
